[project]
name = "panos-mcp"
version = "0.1.0"
description = "Read-only MCP server for Palo Alto Networks Panorama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "anyio>=4.15",
    "ruff>=0.17",
    "mypy>=2.4",
    "jsonschema>=4.26",
    "psutil>=7.2",
    "types-defusedxml",
    "types-psutil",
    "types-jsonschema",
]

[project.scripts]
panos-mcp = "panos_mcp.__main__:main"
panos-mcp-samples = "panos_mcp.samples.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panos_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests against a live lab Panorama (opt-in, PANOS_MCP_LIVE=1)",
    "benchmark: scale benchmarks on synthetic large-estate samples",
]
addopts = "-m 'not live and not benchmark'"
